<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>POE1-Agent</title>
<!-- 内联 favicon：省一个文件，也免掉控制台里那条 404 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='25' font-size='26'>⚗️</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">POE1-Agent<span>无据不答</span></div>
  <nav>
    <select id="conversations" class="ghost" title="切换会话"></select>
    <button id="rename-chat" class="ghost" title="重命名当前会话">重命名</button>
    <button id="delete-chat" class="ghost" title="删除当前会话">删除</button>
    <button id="upload-image" class="ghost" title="上传装备或 Build 截图">上传截图</button>
    <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp" hidden>
    <button id="import-character" class="ghost" title="从 GGG 官方角色 API 导入">导入角色</button>
    <button id="auth-key" class="ghost" title="配置当前标签页使用的 API Key">API 密钥</button>
    <button id="new-chat" class="ghost">新对话</button>
  </nav>
</header>

<main id="main">
  <div class="thread" id="thread"></div>

  <div class="empty" id="empty">
    <h1>问点《流放之路 1》的事</h1>
    <p>只依据知识库作答。查不到会明确说查不到，不会编一个听起来合理的答案。</p>
    <div class="samples">
      <button>猎首（Headhunter）有哪些词缀？</button>
      <button>戒指上「+最大生命」的 T1 是多少？</button>
      <button>偷取词缀的腰带有哪些？</button>
      <button>冈姆的壮志现在给多少生命？</button>
    </div>
  </div>
</main>

<footer>
  <!-- 粘贴识别卡片（需求 6.3/6.4）：识别出装备文本或 PoB 码时先让用户确认再分析 -->
  <div class="paste-card" id="paste-card" hidden></div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="输入问题，或粘贴装备文本 / PoB / 天赋树链接"></textarea>
    <button class="send" id="send" title="发送">↑</button>
  </div>
  <div class="hint">
    答案中的角标可点击跳转到来源。标为「已拦截」的句子是模型试图输出的无据内容，已被出口校验挡下。
  </div>
</footer>

<dialog id="auth-dialog" aria-labelledby="auth-title">
  <form id="auth-form">
    <h2 id="auth-title">连接 POE1-Agent</h2>
    <p>输入服务端配置的 API Key。密钥只保存在当前浏览器标签页，不会写入聊天或日志。</p>
    <label for="auth-input">API Key</label>
    <input id="auth-input" type="password" autocomplete="off"
           spellcheck="false" maxlength="512" placeholder="粘贴 API Key">
    <div id="auth-error" class="auth-error" role="alert" hidden></div>
    <div class="auth-actions">
      <button id="auth-clear" type="button" class="ghost">退出并清除</button>
      <button id="auth-cancel" type="button" class="ghost">取消</button>
      <button id="auth-save" type="submit" class="auth-primary">验证并保存</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>

# POE1-Agent 声明式行为配置
# 密钥不放这里，见 .env

server:
  # 默认只绑本机。要对外提供服务请自行加反向代理与 TLS，
  # 不要直接改成 0.0.0.0（会暴露未加固的管理端点）。
  host: "127.0.0.1"
  port: 8787
  # 所有路由（含 /docs、/openapi.json、静态前端）挂在此前缀下。
  # 用**显式路由前缀**实现，不用 FastAPI 的 root_path——后者是给
  # 「反向代理会剥掉前缀」的场景用的，本机直连时路径对不上。
  # 显式前缀在直连与路径保留型代理（nginx proxy_pass 不改 path）下都成立。
  # 置空则不加前缀。
  base_path: "/poe_agent"
  # 普通业务接口按 API Key 使用进程内令牌桶限流；未配置 API_KEYS 的本机开发模式
  # 共用 anonymous 桶。单进程是本项目约束，因此不引入 Redis 等外部服务。
  rate_limit:
    enabled: true
    requests_per_minute: 60
    burst: 10
  # 可选的管理端来源地址白名单，支持单个 IP 和 CIDR。空列表表示关闭这层限制，仍需
  # ADMIN_TOKEN。只读取 TCP peer，不信任可由调用方伪造的 X-Forwarded-For。
  admin_allowed_ips: []

paths:
  db: "data/poe.db"
  http_cache: "data/http_cache"
  logs: "logs"

llm:
  # 推理模型必须留足预算：实测 GLM 5.2 在"只回答两个字"的任务上
  # 消耗 117 输出 token，其中 114 是推理。设小了会正文为空且不报错。
  max_tokens: 8192
  # 默认不发 temperature。实测该网关背后同时挂着 GLM 与 Bedrock，后者直接拒：
  # `temperature is deprecated for this model` → 整次调用 400 失败。
  # 而 GLM 5.2 是推理模型，temperature 的意义本就有限。
  # 填了数值也没关系：客户端遇到「该模型不支持此参数」会自动停发并重试。
  temperature: null
  timeout_seconds: 180
  # 单轮闸门，防失控循环与费用失控
  max_tool_calls: 12
  max_tokens_per_turn: 60000
  # 分级退避（秒），429 单独识别
  retry_delays: [1, 2, 4, 8, 15]
  # 凭证冷却（秒）：额度类可带外补充故定期重试；鉴权类不会自愈但也不写死到进程结束
  cooldown_budget_seconds: 1800
  cooldown_auth_seconds: 3600
  # 模型别名 → 完整模型 ID
  model_aliases:
    glm: "glm-5.2"
    opus: "claude-opus-5"
    sonnet: "claude-sonnet-4-6"
    haiku: "claude-haiku-4-5"
  # 需要二次判断的场景用廉价模型，不占主模型预算
  gate_model: "claude-haiku-4-5"
  # 可选：支持 OpenAI image_url 消息的视觉模型。留空时截图入口返回明确的 503，
  # 不会把普通文本模型冒充 OCR。模型只做转录，结果必须由用户确认后才进入分析。
  vision_model: ""

retrieval:
  top_k: 20
  # 相对相关度分数，**仅用于排序**，不作充分依据判据
  # （相对归一化下最优项恒为 1.0，用它做阈值等于闸门永不触发）
  min_score: 0.35
  # 充分依据判据：查询的实义词有多少比例真的出现在候选文档里。
  # 这是绝对量，可解释也可阈值化。实测「流放之路2 的升华机制是什么」
  # 只命中「升华」→ 覆盖率 20%，据此正确拒答；而 bm25 绝对值
  # （-8.97 vs 猎首的 -9.99）落在同一量级，无法区分。
  # 已用黄金问答集标定（2026-08-17，`scripts/eval_run.py --sweep`，47 条用例）：
  #   0.30 / 0.40 / 0.50 / 0.60 四档**结果完全相同**（错误拒答 1、漏出 3）；
  #   0.70 起多出一条错误拒答；0.80 才多拦住一条漏出，代价是再多一条错误拒答。
  # 也就是说在本集上它几乎是惰性参数——两条漏出走的是「实体精确命中」分支，
  # 根本不经这个阈值。**所以保持 0.5，不要试图靠调它压漏出**：
  # 那只会用错误拒答换漏出。真正的修法是维度覆盖闸门（kb/coverage.dimension_gap）。
  # 基线与结论见 tests/golden/BASELINE.md。
  min_coverage: 0.5
  # RRF 融合常数
  rrf_k: 60
  # 来源优先级衰减：同等相关度下高优先级来源排前
  priority_decay: 0.08
  timeout_seconds: 8

  vector:
    # 2026-08-04 实测：网关未注册 embedding 模型 → 关闭。
    # 关闭后走 BM25 + 实体精确匹配 + search_keywords 补偿。
    enabled: false
    # 维度不写死：启用时按 embedding 模型实际输出维度建表
    dim: 0
  rerank:
    enabled: false

  # 事实句判定领域词表：命中这些词的句子视为事实断言，
  # 必须绑定引用，否则在出口被拦截。
  #
  # 实测（2026-08-17，30 条真实回答）：**这份词表当前不改变任何拦截结果**——
  # 全部生效与完全清空，拦截数都是 120。原因是 `binding.classify` 的默认值就是
  # 「事实句」（判不出类型即按事实句处理，安全侧），词表只是让判定提前命中一步。
  # 触发路径分布：有绑定标记 158 / 命中本词表 66 / 命中库内领域词 30 /
  # 含数值 4 / 兜底默认 12。
  #
  # 保留它的理由：一旦将来把 classify 的默认改成「过渡句」（那需要先把漏出率压到
  # 可接受），这份词表就会立刻变成主判据。改动前请先跑 `scripts/eval_run.py --gate`
  # 看它是否已经开始影响结果。
  factual_terms:
    - 词缀
    - 隐式
    - 显式
    - 腐化
    - 裂隙
    - 合成
    - 附魔
    - 底材
    - 物品等级
    - 需求等级
    - 抗性
    - 暴击
    - 增伤
    - 技能石
    - 升华
    - 万神殿
    - 天赋
    - 概率
    - 权重
    - 掉落

sources:
  # P1 POEDB > P2 PoB src/Data > P3 Wiki > P4 Craft of Exile > P5 经济
  # > P6 官方 Patch Notes > P7 社区
  # P7 不得支撑事实断言，仅可标注为社区观点用于建议类内容。
  #
  # PoB 排 P2 而非 P1：数值与结构上它更接近一手（自 GGG 客户端 .dat 机器导出），
  # 但不含中文名与页面说明，且社区分支存在人工修补。POEDB 保持最高优先级，
  # 冲突时推荐 POEDB（需求 15.5）。
  priority:
    POEDB: 1
    Path of Building: 2
    PoE Wiki: 3
    Craft of Exile: 4
    poe.watch: 5
    GGG Patch Notes: 6
    Community: 7

  pob:
    # PoB 仓库位置。留空则按 POB_PATH 环境变量 → 仓库同级 ../PathOfBuilding 解析。
    # 不写绝对路径，避免把本机目录结构带进版本库（跨平台规则）。
    path: ""
    # 引用 URL 的仓库地址。导入时把当前 commit SHA 钉进 URL，使引用可复现。
    repo_url: "https://github.com/PathOfBuildingCommunity/PathOfBuilding"
    # 唯一装备的历史变体：只取 Current。1293 件里 752 件带 Variant 标记，
    # 不过滤会把旧版数值和现版数值一起输出（如冈姆的壮志 +500 与 +1000 并存）。
    variants: "current_only"

crawl:
  user_agent: "poe1-agent/0.1 (knowledge base builder; contact: admin)"
  # 令牌桶限速：对目标站点友好
  requests_per_second: 0.5
  concurrency: 2
  timeout_seconds: 60
  # 缓存有效期；未过期且内容哈希未变则跳过重新抽取与索引
  cache_ttl_hours: 24

knowledge_sync:
  # scripts/sync_knowledge.py 默认只预览；显式 --apply 后，只执行超过此时长的分类。
  stale_after_hours: 168
  # 唯一装备暂不自动化：主列表刷新会覆盖详情页补齐词条，必须等完整详情链原子化。
  categories:
    - mods
    - bench
    - metamods
    - tree
    - currency
    - maps
    - scarab
    - essence
    - horticraft
    - monsters

economy:
  # poe.watch 实时价格只作为市场统计快照，不代表保证成交价。
  enabled: true
  cache_ttl_minutes: 30
  # 上游失败可退回旧缓存；超过该阈值仍会返回，但必须显式标成陈旧。
  stale_after_hours: 6
  # 趋势只保留实际查询命中的条目；同一快照重复查询按抓取时间去重。
  history_retention_days: 90
  # 结构化响应最多返回多少个等距采样点；趋势计算仍使用窗口内全部观测。
  max_trend_points: 200
  timeout_seconds: 15
  # 与采集器一致，对公共 API 保持克制；0 表示不做客户端节流。
  requests_per_second: 0.5

logging:
  level: "INFO"
  # 按日期后缀直接命名新文件，不做 rename 轮转
  # （Windows 上文件被杀软/索引器占用时 rename 会抛 WinError 32）
  retention_days: 14

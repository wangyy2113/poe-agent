  <text x="105" y="71" fill="#D7B87D" font-size="13" letter-spacing="3.5">THE EXILE’S FIELD GUIDE</text>
  <text x="72" y="155" fill="#88A299" font-size="12" letter-spacing="3">KNOWLEDGE. CALCULATION. CONVICTION.</text>
  <text x="67" y="252" fill="url(#gold)" font-family="Georgia,'Times New Roman',serif" font-size="88" letter-spacing="-4">POE1-AGENT</text>
  <text x="73" y="308" fill="#E4EBE6" font-size="28" letter-spacing=".3">Every claim, a source.</text>
  <text x="73" y="343" fill="#859A95" font-size="16">Your evidence-first companion for Path of Exile 1.</text>
  <g font-size="11" letter-spacing="1.5">
    <rect x="73" y="390" width="130" height="32" rx="4" fill="#D4B47A" fill-opacity=".09" stroke="#D4B47A" stroke-opacity=".28"/><text x="93" y="410" fill="#DDC393">DEEPSEEK</text>
    <rect x="213" y="390" width="155" height="32" rx="4" fill="#6FD2B4" fill-opacity=".06" stroke="#6FD2B4" stroke-opacity=".22"/><text x="232" y="410" fill="#91C9B8">LOCAL SQLITE</text>
    <rect x="378" y="390" width="145" height="32" rx="4" stroke="#647B74" stroke-opacity=".35"/><text x="398" y="410" fill="#A3B7AF">WEB · API · MCP</text>
  </g>
  <path d="M73 465H570" stroke="#D0B278" stroke-opacity=".16"/>
  <text x="73" y="493" fill="#647D73" font-size="10" letter-spacing="2.5">BUILT TO EXPLAIN. DESIGNED TO VERIFY.</text>
</g>

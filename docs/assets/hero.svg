<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" fill="none" role="img" aria-labelledby="title desc">
<title id="title">POE1-Agent — Every claim, a source.</title>
<desc id="desc">An obsidian and gold field guide for Path of Exile. A teal constellation surrounds a geometric portal representing evidence, computation and verification.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="#141921"/><stop offset=".5" stop-color="#0D1319"/><stop offset="1" stop-color="#092522"/></linearGradient>
  <linearGradient id="gold" x1="72" y1="190" x2="670" y2="270" gradientUnits="userSpaceOnUse"><stop stop-color="#F6EAD2"/><stop offset=".5" stop-color="#D7B87D"/><stop offset="1" stop-color="#A47740"/></linearGradient>
  <linearGradient id="gem" x1="925" y1="168" x2="1030" y2="350" gradientUnits="userSpaceOnUse"><stop stop-color="#BCF9E5"/><stop offset=".45" stop-color="#52BC9F"/><stop offset="1" stop-color="#13534D"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#50CBA6" stop-opacity=".19"/><stop offset="1" stop-color="#50CBA6" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#AEC3BC" stroke-opacity=".04"/></pattern>
</defs>

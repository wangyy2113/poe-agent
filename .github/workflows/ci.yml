name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    env:
      PYTHONUTF8: "1"
      LLM_BASE_URL: https://example.invalid
      LLM_API_KEY: sk-ci-placeholder
      ADMIN_TOKEN: ci-admin-placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Clean-install release smoke
        run: python scripts/ci_smoke.py
      - name: Portability contract
        run: python scripts/check_portability.py
      - name: Specification references
        run: python scripts/check_spec_refs.py

  migration-source:
    name: Linux migration source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Build SQLite and config fixture
        run: python scripts/migration_smoke.py prepare migration-fixture
      - uses: actions/upload-artifact@v4
        with:
          name: migration-fixture
          path: migration-fixture/
          retention-days: 1

  migration-windows:
    name: Windows real-process migration / Python 3.12
    needs: migration-source
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fresh environment setup
        run: python scripts/setup.py
      - uses: actions/download-artifact@v4
        with:
          name: migration-fixture
          path: migration-fixture/
      - name: Copy config and database, start server, query Chinese text
        run: .\.venv\Scripts\python.exe scripts\migration_smoke.py verify migration-fixture

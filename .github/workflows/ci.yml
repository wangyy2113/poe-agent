name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    env:
      PYTHONUTF8: "1"
      LLM_BASE_URL: https://example.invalid
      LLM_API_KEY: sk-ci-placeholder
      ADMIN_TOKEN: ci-admin-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Clean-install release smoke
        run: python scripts/ci_smoke.py
      - name: Portability contract
        run: python scripts/check_portability.py
      - name: Specification references
        run: python scripts/check_spec_refs.py

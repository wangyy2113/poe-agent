    kind: gap
    expect_gap: true
    note: >-
      **有了权重不等于有了成功率**：这一维页面没给，也没有第二来源。
      共鸣器的组合规则同样未采集
    lesson: >-
      这条是 `num_fossil_tag_weight` 的成对点。第六十五轮把「乘数」从
      `missing_dimension_hints` 里删掉，删早了会让有据的问题被拒、
      删多了会让这两维漏出，所以两条必须一起看。


  - id: num_prefix_capacity
    query: 稀有装备最多能有几条前缀
    kind: numeric
    expect_values: ["3"]
    note: >-
      稀有 3 前缀 3 后缀。**这条用例第四十四轮从 `kind: gap` 翻成了数值类**，
      而且它的 note 从第三十七轮起就过期了——那一轮 `craft_affix_capacity`
      入库并做了卡片，答案一直在库里
    lesson: >-
      翻面的**触发方式**才是这条的价值：第四十四轮往宝石卡加了 2149 条固定效果，
      语料一变 BM25 就把这条哨兵从「拒答」推成了「漏出」。查下去发现真正的毛病是
      **那张名额规则卡不可达**——被 9.4 万条词缀阶梯 chunk 淹没，
      连「前缀名额」都进不了 top20，top1 永远是某条「物品稀有度提高」的词缀
      （稀有/装备/前缀 三个通用词全中）。**卡片存在但检索不到，等于能力是死的**，
      与幽魂、Boss 技能「没有卡片」是同一种结果，所以修法也一样：
      精确事实走结构化工具（`affix_capacity_rules`）+ 意图词路由，不指望 BM25。
      顺带记一条：`craft_rule` 域的 hints 当年只写了「几个前缀」，
      而用户会说「几**条**前缀」——差一个量词就路由不到。


    forbid_in_answer: ["可能会", "预计", "大概"]
    note: 用户明确索要猜测·必须说明本助手不提供猜测

  - id: gap_price_headhunter
    query: 猎首现在值多少混沌石
    kind: gap
    expect_gap: true
    forbid_in_answer: ["大约", "左右", "参考价"]
    note: 经济源未接入（economy_price = not_collected），不得按同类物品类推价格

  - id: gap_cluster_jewel_notables
    query: 大型星团珠宝能开出哪些大点
    kind: gap
    expect_gap: true
    note: cluster_jewel = not_collected
    lesson: >-
      易误判：ModJewelCluster.lua 已入库，但那是星团珠宝**自身的词缀**，
      不是它能开出的天赋点定义。

  - id: gap_prefix_capacity

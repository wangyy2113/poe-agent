      是**页面自己给的数字**，不是推断出来的
    lesson: >-
      证据里的乘数**不能渲染成 `x10.0`**：页面写的是 `x10`，模型照页面复述时
      数值回填会因为多出来的那一位小数点在证据里找不到，
      于是一句完全正确的话被自己的闸门拦掉（判据在 `_fmt_multiplier`）。


  # ── 地图（2026-08-19 第十九轮入库）──────────────────────────────
  - id: desc_map_boss
    query: 奇术秘殿的头目是谁
    kind: description
    expect_slug: "map:奇术秘殿"
    expect_evidence_text: "天雷之使派蒂"
    note: 地图头目。这个域挂了三页，只有 Atlas_of_Worlds 有实质内容

  - id: num_map_tier
    query: 王陵是几阶地图
    kind: numeric
    expect_slug: "map:王陵"
    expect_values: ["13"]
    note: 等阶。实测 159 张里只有 110 张有——没有的留空，不补 0

  - id: desc_map_links
    query: 晴空幽岛在异界图鉴上连着哪些地图
    kind: description
    expect_slug: "map:晴空幽岛"
    expect_any_hit: true
    note: >-
      卡片里的 `Link` 就是图鉴连接关系，159 张全有。这条同时说明一件事：
      一页的价值要看 DOM——同域另两页（Maps / Atlas）几乎没有可用内容

  - id: route_mod_class_summary
    query: 异界地图的词缀一共有多少
    kind: tool_route
    expect_tool: mod_class_summary
    note: >-
      第六十三轮新增。总量类问法 `kb_search` **答不了**：它是相关度检索，
      `top_k` 之外按设计丢掉（实测每次命中 20 条只把 8 条给模型），
      既不知道总数、也不该报截断——报了就是每答必喊狼来了
    lesson: >-
      这个工具**必须排在 `mod_tiers` 后面**：首个命中即返回，而
      「…精华词缀有哪些**档位**」同时含「词缀有哪些」与「档位」，
      它问的是某一条词缀的梯度。排前面会把它抢走，实测被既有用例
      `test_词缀阶梯问法不被抢走` 当场拦下——**具体梯度问法胜过总览问法**。
      证据里必须**带上总数**：不然模型说出来就是无绑定断言、被自己的闸门拦掉，
      用户反而丢了这个信息（上一轮 `desc_map_mods` 就是这么丢的）。

  - id: desc_map_mods
    query: 地图词缀有哪些
    kind: description
    expect_any_hit: true
    note: >-
      **这条第六十轮从 `kind: gap` 翻成了描述类**：361 条 `异界地图` 词缀入库
      （掉落池 301 / 腐化 55 / 深渊 5），来自 `Maps_low/mid/top/uber_tier`
      与 `Maps_old` 五页，与其它底材类别同一张表、同一套 T 级卡片
    lesson: >-
      先前那句「地图词缀未采集」记的是 `Maps` 页那 12 条未翻译的 stat id，
      **而真正的来源是另外五页**——它们就并排列在词缀枢纽页上，
      只是链接不带 `#ModifiersCalc` 片段，被 `discover_mod_class_pages`
      的正则静默丢掉：147 个 `<li>` 链接里只有 101 个带片段。
      旧代码唯一的守卫是「一个都没发现就报错」，它拦得住整页改版、
      **拦不住少认了 46 个**。教训是这一维一直被写成「上游没有」，
      而实际是「我们从没去看过那几页」——**「查不到」与「没去看过」
      在用户那边分不开**，判据见 `poedb_index.HubCandidate`。

  - id: gap_map_scourge_mods
    query: 地图上的魔血能给什么
    kind: gap
    expect_gap: true
    note: >-
      成对哨兵：魔血（Scourge）那 185 条在 POEDB 载荷里 `str` **就是空的**
      （实测 `"str": ""`），没有可展示文本因而未入库
    lesson: >-
      上一条放宽时把宽泛的「词缀有哪些」从 `missing_dimension_hints` 里删了，
      于是补了「魔血」这个**专指**哨兵。它只挂在地图域，
      非地图的魔血问题（其它底材共 6,557 条）走不到这里（实测
      `胸甲上的魔血词缀有哪些` 仍照常作答）。
      **这条用例的问法是量出来的，不是想出来的**：本来写的是
      「地图上的魔血**词缀**有哪些」，实测它 `is_gap=False` ——
      因为 `is_gap = uncovered and not covered`，而**任何带「词缀」的问题
      都会让 `mod_affix`（已采集）成为 covered**，一个领域覆盖到就不拦
      （复合问题按需求要「有据的部分照答」）。同一个哨兵换成不含「词缀」的
      四种问法全部正确拒答。教训：**判断闸门有没有生效要走
      `_apply_dimension_gate` 的真实路径**，我先前拿 `bool(uncovered)`
      当判据，它把这条用例报成「拦住了」——**测量本身错了一次**。

  - id: num_max_resistance_cap
    query: 抗性上限是多少
    kind: numeric
    expect_values: ["75"]
    note: 游戏常量 characterConstants.base_maximum_all_resistances_% = 75
    lesson: >-
      常量走 calc/constants.py，缺失即抛异常绝不给默认值。这条同时验证
      game_constant 表（P2 PoB，钉 commit）能被检索到。

      2026-08-19 第二十轮起这条**改由 resistance_calc 作答**（意图词「抗性上限」），
      因此在检索侧成了路由豁免。它的旧录制是「从 chunk 里读到 75」那一版，
      已经过期——真实答案现在还会带上最大抗性 90 的硬上限与承受倍率。

  - id: route_resistance_calc
    query: 我火抗 120 是不是浪费了
    kind: tool_route
    expect_tool: resistance_calc
    note: >-
      「抗性词 + 数字」这条路由通道（意图词表里没有这种问法，也不可能列全）
    lesson: >-
      它**放在意图词表之后**判，所以优先级最低：「+40% 火焰抗性这条词缀有几档」
      仍归 mod_tiers、「火焰抗性能从哪些渠道获得」仍归 stat_sources。
      顺序就是判据的一部分，挪到前面会立刻抢走那两类问题
      （`tests/unit/test_resistance.py` 的 ResistanceRouteTest 成对钉住）。

  - id: num_resistance_overcap_with_pen
    query: 我火抗 120，敌人有 25% 火焰穿透，实际生效的火抗是多少
    kind: numeric
    expect_values: ["75", "45"]
    expect_in_answer: ["图腾抗性"]
    note: >-
      实际生效 75%（被上限夹住）、超出上限 45%。穿透在**夹上限之后**才减，
      所以那 45% 超抗顶不住穿透——这是 PoB 两处代码的先后顺序，不是经验之谈
    lesson: >-
      `expect_in_answer` 只断言**代码附注**的内容（`loop._NOTE_FIELDS` 逐字附上的
      边界声明里有「图腾抗性」），不断言模型的措辞——第十七轮在这上面栽过一次：
      断言「主天赋树」失败，而失败原因只是模型换了个说法。

  - id: num_resistance_after_map_penalty
    query: 地图上有 -60% 元素抗性，我火抗 120，进图之后火抗还剩多少
    kind: numeric
    expect_values: ["60"]
    note: >-
      120 − 60 = 60，落在上限以下 → 实际生效 60%。这条与上一条成对：
      超抗顶得住减抗（减抗进的是加总那一步），顶不住穿透（穿透在夹上限之后）


    note: 点数要在图上算，kb_search 只能命中节点卡片（卡片里没有连接关系）

  # ══ 工具路由：能精确算的不要猜（需要在线或录制）══════════════════════════
  # ALLOWED_TOOLS 的顺序即推荐优先级，这一类验证模型是否按该优先级选工具。
  # 本类不设门槛，作为附加观测记录——路由错不一定导致答案错，但会让本可精确
  # 回答的问题退化成 BM25 命中一张卡再读表格。

  - id: route_mod_tiers
    query: 腰带上的力量词缀一共有几档，每档要求什么物品等级
    kind: tool_route
    expect_tool: mod_tiers
    note: 词缀档位/物品等级/权重 → mod_tiers，不该用 kb_search

  - id: route_stat_sources
    query: 法术压制能从哪些渠道获得
    kind: tool_route
    expect_tool: stat_sources
    note: 枚举类「某属性能从哪来」→ stat_sources（逐渠道 + 未采集声明）

  - id: route_entity_lookup
    query: 冈姆的壮志的完整词缀列表
    kind: tool_route
    expect_tool: entity_lookup
    note: 已知确切名称的实体 → entity_lookup

  - id: route_kb_coverage
    query: 你的知识库covered哪些领域
    kind: tool_route
    expect_tool: kb_coverage
    note: 不确定本库有没有某领域 → kb_coverage

  - id: route_check_mod_combination
    query: 精金胸甲上「+最大生命」和「+火焰抗性」能不能同时存在
    kind: tool_route
    expect_tool: check_mod_combination
    note: 多目标词缀共存 → check_mod_combination（三态，unknown 要原样说明）

  - id: desc_headhunter_acquisition
    query: 猎首怎么获得
    kind: description
    expect_slug: Headhunter
    expect_evidence_text: "命运卡：疯医"
    note: >-
      猎首可由 5 张命运卡换到（疯医/劣魔/女之武神/无畏者/恶魔）。
      **这条钉的是「最自然的问法要走得通」**
    lesson: >-
      第五十四轮把 387 行获取途径入库了，却只有工具出口。实测「猎首怎么获得」
      路由到 `stat_sources`（「某属性能从哪来」的工具），卡上一个字都没有——
      **数据入库但出口不全**是这个项目反复踩的坑。第五十五轮接到卡上之后，
      普通检索命中这张卡就能答，不再依赖意图词猜对。
      判据钉在**证据**上而不是模型措辞上（与 `desc_gem_support_yes` 同一条）。

  - id: route_acquisition_card
    query: 哪张命运卡能换到崇高石
    kind: tool_route
    expect_tool: acquisition_routes
    note: >-
      获取途径（第五十四轮，387 行）。**不只是命运卡**：`Ingredient` 非空时
      是升级配方（托沃崩 + 托沃的祝福 → 托沃卧），混成一类会答错
    lesson: >-
      成对点是**裸的「怎么获得」不能收进这条的意图词**——它是 `stat_sources` 的，
      第五十一轮实测「混沌石怎么获得」就是被它抢走的；而且通货的主要来源是**掉落**、
      那一维本库没有，放开等于拿次要途径顶替主要途径。
      单测 `test_裸的怎么获得不能被抢过来` 两个方向都钉了。

  - id: route_vendor_recipe
    query: 6 词缀稀有物品能换什么
    kind: tool_route
    expect_tool: vendor_recipe_lookup
    note: >-
      商店配方（第五十一轮）。这一页**一直在缓存里**、从来没被抽取过——
      本轮先翻缓存才没有去抓 113 张通货详情页，是「停在一页上就下缺来源结论」
      那个错误的反面
    lesson: >-
      与 `gap_currency_drop_source` 成对：商店配方补的是「怎么**换**」，
      而通货的主要来源是**掉落**，那一半仍未采集。所以广义问法
      「混沌石怎么获得」照旧拒答、具体问法「怎么换」答得出来。
      本轮一度把「怎么获得」从 `missing_dimension_hints` 删掉，实测它
      **路由到了 `stat_sources`**（那是「某属性能从哪来」的工具，答非所问），
      于是加了回来——记在 `kb/coverage.py` 的注释里免得下次再删一遍。

  - id: route_gem_support_match
    query: 多重投射能不能辅助冰霜脉冲
    kind: tool_route
    expect_tool: gem_support_match
    note: >-
      搭配问法 → gem_support_match（第四十五轮）。这一维**没有卡片**：
      每个技能平均 ~99 颗辅助，而卡片上限 1200 字

  - id: route_affix_capacity
    query: 魔法装备最多能有几条后缀
    kind: tool_route
    expect_tool: affix_capacity_rules
    note: >-
      名额问法 → affix_capacity_rules（第四十四轮）。成对的另一面是
      `route_check_mod_combination`：**问名额**与**问某组词缀能否共存**是两件事，
      判据是问句形式，裸的「前缀/后缀」会把 mod_tiers 的档位问题抢过来

  # ── Boss 技能伤害建模（2026-08-27 第三十八轮入库）────────────────
  - id: route_boss_skill_damage
    query: 谢勒的球在 84 级打多少伤害
    kind: tool_route
    expect_tool: boss_skill_damage
    note: >-
      伤害是**算**出来的（`monsterDamageTable[等级] × (基准 + 掷骰 × 增量)`），
      证据不在任何 chunk 里，所以只能靠工具到达

  - id: num_boss_shaper_ball
    query: 谢勒的球在 84 级最高打多少冰霜伤害
    kind: numeric
    expect_values: ["14382"]
    note: >-
      掷骰区间上界。未指定区间时工具给两端，**不替用户挑一个点**——
      「打多少伤害」的诚实答案是一个区间

  - id: route_boss_survival_check
    query: 84级 Shaper Ball，6000血、75冰抗，能扛得住吗
    kind: tool_route
    expect_tool: boss_survival_check
    note: >-
      只有技能名、等级、防御池和对应抗性都能逐字冻结时才代码直达；工具输出的三态
      只覆盖一次单类型命中，不能改写成整场 Boss 战生存保证

  - id: route_boss_repeated_hit_check
    query: 84级 Shaper Ball，10000血、75冰抗，连续3次能扛得住吗
    kind: tool_route
    expect_tool: boss_survival_check
    note: >-
      明确的“连续 3 次”提取为 hit_count=3；工具只按同一技能每次都命中、
      期间无恢复累加，不冒充真实 Boss 连招模拟

  - id: route_boss_hit_capacity
    query: 84级 Shaper Ball，6000血、75冰抗，最多能扛几下
    kind: tool_route
    expect_tool: boss_survival_check
    note: >-
      不指定 hit_count 时仍用同一防御链反解最坏/最好掷骰下的可承受击数；
      等于池子的首个击数算耗尽，不引入恢复或命中概率

  - id: route_boss_required_pool
    query: 84级 Shaper Ball，75冰抗，连续3次需要多少血
    kind: tool_route
    expect_tool: boss_defence_threshold
    note: >-
      未给目标池时独立门槛工具按当前抗性反解覆盖低掷骰与完整区间所需的最小整数防御池；
      不使用虚构的当前血量，也不把连续命中扩写成真实 Boss 连招

  - id: route_boss_required_resistance
    query: 84级 Shaper Ball，5000血，连续2次需要多少冰抗
    kind: tool_route
    expect_tool: boss_defence_threshold
    note: >-
      给出目标池时反解穿透前抗性并披露缺口；90% 上限仍不能严格覆盖累计承伤时返回不可达，
      不伪造超上限抗性

  - id: route_boss_explicit_sequence
    query: 84级 Shaper Ball 2发，然后 Shaper Slam 1下，25000血、75冰抗、10000护甲，这套连招扛得住吗
    kind: tool_route
    expect_tool: boss_sequence_check
    note: >-
      只在用户逐字给出至少两种已知 Boss 技能、顺序、等级和防御池时直达序列工具；
      每种伤害分别使用对应抗性或护甲，不把用户假设的序列称为真实 Boss 连招

  - id: route_boss_risk_audit
    query: 84级，10000血、75冰抗、0混抗、10000护甲，所有 Boss 技能哪个最危险
    kind: tool_route
    expect_tool: boss_risk_audit
    note: >-
      等级与防御池可唯一冻结时横向审计当前收录的单击；缺少火抗或电抗只让对应技能保留
      unknown，不能把未知项排到末尾当作低风险，也不能把单击承伤排行称为 Boss 难度排行

  - id: route_boss_defence_gap_audit
    query: 84级，5000血、75冰抗、0混抗、10000护甲，所有 Boss 技能连续2次要补多少防御
    kind: tool_route
    expect_tool: boss_risk_audit
    note: >-
      横向审计支持用户明确指定 1–100 次同技能连续命中；按累计最坏承伤排序并复用同一闭式
      返回逐技能池子缺口、抗性或护甲单轴目标，以及覆盖全部已评估技能的统一池子门槛。
      未提供的伤害类型防御仍逐项 unknown，不从“连续2次”推断真实技能多段数或 Boss 连招

  - id: gap_boss_fight_mechanics
    query: 谢勒怎么打，有什么机制要躲
    kind: gap
    expect_gap: true
    note: >-
      PoB 只给**伤害建模**，POEDB 的 Monsters 页也没有打法；
      技能机制、阶段与应对本地没有来源
    lesson: >-
      域从 harvested 变成 partial 只说明**某一维**补上了。这个域补的是伤害建模，
      partial_note 与 missing_dimension_hints 必须把「打法仍未采集」写死，
      否则「已采集」会替打法那一维背书。

  # ── 制作规则：觉醒者之石双物品状态机（2026-09-22）──────────────
  - id: route_awakener_orb_state
    query: 觉醒者之石如何约束制作操作
    kind: tool_route
    expect_tool: awakener_orb_state
    note: >-
      逐字绑定 POEDB 效果，缺少两件输入时由工具精确说明需要补什么；不再把
      “来源已入库但参数未给”误报为整个领域未采集
    lesson: >-
      `compatible` 只证明同类输入与双方不同传统影响满足已审计原文；原文没说
      “各保留一条影响词缀”，因此工具必须把具体保留词缀与重铸结果继续列为 unknown。

  - id: route_bench_recipe
    query: 工艺工作台上有没有加最大生命的选项，费用是多少
    kind: tool_route
    expect_tool: bench_recipe_catalog
    note: 工艺台目录/原始费用 → bench_recipe_catalog，不得改写成制作步骤

  - id: route_craft_operation_state
    query: 稀有装备 2 条前缀 3 条后缀还能用崇高石吗
    kind: tool_route
    expect_tool: craft_operation_state
    note: 基础通货操作状态与已知名额 → craft_operation_state；不得改写成制作路线或成功率

  - id: route_craft_operation_metamod_context
    query: 神圣石在前缀无法被变更下的结果是什么
    kind: tool_route
    expect_tool: craft_operation_state
    note: >-
      自然问法不必显式说“来源矩阵”；基础通货效果与唯一逐字 guard 一起进入
      craft_operation_state，由它并列返回 POEDB 状态转移和 Craft of Exile 矩阵原值。
      矩阵值不得被解释成完整执行规则，缺记录时必须保持 unknown。

  - id: route_spectre_stats
    query: 生命倍率最高的幽魂是哪个
    kind: tool_route
    expect_tool: spectre_stats
    note: >-
      幽魂表**没有卡片**，只能靠「幽魂」意图词路由到工具。这条钉住可达性——
      不路由它就是一个死了的能力

  - id: route_metamod_matrix
    query: 元词缀矩阵里神圣石对前缀无法被变更是什么结果
    kind: tool_route
    expect_tool: metamod_interaction_matrix
    note: 逐字 operation × guard + **显式提到来源** → metamod_interaction_matrix
    lesson: >-
      这个能力此前**完全没有用例**：craft_metamod_interaction 长期 0 行，工具永远返回缺据，
      连闸门里为它写的 scope 规则都是不可达代码，于是评测也就没人想起来覆盖它。
      2026-08-18 发现 0 行的原因不是「需联网」——POEDB 镜像页一直在 http_cache 里、
      抽取器对它跑得通（134 条），只是这条采集从来没跑过。补上用例，
      免得下次某个能力又在「代码写了、数据没进、评测不覆盖」三不管里躺着。

      措辞里**必须出现「元词缀矩阵」**：`_metamod_source_policy` 只在问题显式提到来源时
      才返回 positive，否则不路由（`tests/unit/test_metamods.py` 的
      `test_不含矩阵限定同义词改参和多余参数均拒绝` 把这条钉死了）。这是刻意的——矩阵是
      社区页（P4）的转述、没有可验证的版本范围，它的单元格不能被当成通用游戏规则读。
      代价是用户不提来源就拿不到答案；要改这个契约得是一次**明确的产品决定**加新证据，
      不是把判据悄悄放宽。第一版用例写成「神圣石在「前缀无法被变更」下的结果是什么」，
      录制出来是 0 token 的缺据——被路由挡住了，正好把这条契约量了出来。

  - id: gap_metamod_blank_cell
    query: 元词缀矩阵里异能混沌石对无法骰出攻击词缀是什么结果
    kind: gap
    expect_gap: true
    note: 来源页面该格为空白 → 必须拒答，不能推断为 N/A
    lesson: >-
      空白格是这套矩阵最危险的地方：页面留空**不等于** N/A，也不等于 unknown。
      入库时空白格只进抽取审计、不成为 Citation（实测该页有 2 个空白格，
      都在异能混沌石那一行），编排层再由 _metamod_source_blank_answer 生成确定性拒答。
      这条用例钉的是「代码路径」而不是「模型自觉」。

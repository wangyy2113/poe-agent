    kind: gap
    expect_gap: true
    note: >-
      怪物技能在 PoB 侧只有内部 id（`MonsterLightningThorns`），实测 1235 个 id 与本库
      810 颗宝石的 grantedEffectId **零命中**——它们不是玩家宝石，没有中文名可给
    lesson: >-
      有数据不等于可呈现。这一维的 id 存进了 `pob_spectre.skill_ids`（将来接怪物技能表
      时它就是桥接键），但不进卡片也不进工具正文。

  - id: gap_monster_mod_weight
    query: 惊悸迷雾怪物词缀的生成权重是多少
    kind: gap
    expect_gap: true
    note: 怪物词缀入库了效果文本，但生成权重与出现规则未采集

  - id: num_passive_path_cost
    query: 从起点点到神威之盾要花几个天赋点
    kind: numeric
    expect_values: ["11"]
    note: >-
      2026-08-19 第十五轮起**可答**：连接关系与职业起点入库后，`passive_path` 按职业
      分别算。最省是圣堂武僧与野蛮人各 11 点（树 3.29）
    lesson: >-
      这条用例**从拒答翻成可答**，而且答案必须**按职业分别给**——同一个基石从暗影
      起点要 24 点、从游侠 25 点。给一个笼统的数字就是错答案。
      路径逐节点列出来当证据，用户可以照着核对：这是「算」与「猜」的区别。

  - id: gap_passive_cluster_jewel
    query: 星团珠宝上的天赋要花几个天赋点
    kind: gap
    expect_gap: true
    note: >-
      星团珠宝上的天赋不在主天赋树上（`cluster_jewel` 是独立领域且未采集），
      主树的连接关系答不了它

  - id: route_passive_path
    query: 从起点点到坚毅之心要花几个天赋点
    kind: tool_route
    expect_tool: passive_path
    note: 点数要在图上算，kb_search 只能命中节点卡片（卡片里没有连接关系）

  # ══ 工具路由：能精确算的不要猜（需要在线或录制）══════════════════════════
  # ALLOWED_TOOLS 的顺序即推荐优先级，这一类验证模型是否按该优先级选工具。
  # 本类不设门槛，作为附加观测记录——路由错不一定导致答案错，但会让本可精确
  # 回答的问题退化成 BM25 命中一张卡再读表格。

  - id: route_mod_tiers
    query: 腰带上的力量词缀一共有几档，每档要求什么物品等级
    kind: tool_route
    expect_tool: mod_tiers
    note: 词缀档位/物品等级/权重 → mod_tiers，不该用 kb_search

  - id: route_stat_sources
    query: 法术压制能从哪些渠道获得
    kind: tool_route
    expect_tool: stat_sources
    note: 枚举类「某属性能从哪来」→ stat_sources（逐渠道 + 未采集声明）

  - id: route_entity_lookup
    query: 冈姆的壮志的完整词缀列表
    kind: tool_route
    expect_tool: entity_lookup
    note: 已知确切名称的实体 → entity_lookup

  - id: route_kb_coverage
    query: 你的知识库covered哪些领域
    kind: tool_route
    expect_tool: kb_coverage
    note: 不确定本库有没有某领域 → kb_coverage

  - id: route_check_mod_combination
    query: 精金胸甲上「+最大生命」和「+火焰抗性」能不能同时存在
    kind: tool_route
    expect_tool: check_mod_combination
    note: 多目标词缀共存 → check_mod_combination（三态，unknown 要原样说明）

  - id: route_bench_recipe
    query: 工艺工作台上有没有加最大生命的选项，费用是多少
    kind: tool_route
    expect_tool: bench_recipe_catalog
    note: 工艺台目录/原始费用 → bench_recipe_catalog，不得改写成制作步骤

  - id: route_spectre_stats
    query: 生命倍率最高的幽魂是哪个
    kind: tool_route
    expect_tool: spectre_stats
    note: >-
      幽魂表**没有卡片**，只能靠「幽魂」意图词路由到工具。这条钉住可达性——
      不路由它就是一个死了的能力

  - id: route_metamod_matrix
    query: 元词缀矩阵里神圣石对前缀无法被变更是什么结果
    kind: tool_route
    expect_tool: metamod_interaction_matrix
    note: 逐字 operation × guard + **显式提到来源** → metamod_interaction_matrix
    lesson: >-
      这个能力此前**完全没有用例**：craft_metamod_interaction 长期 0 行，工具永远返回缺据，
      连闸门里为它写的 scope 规则都是不可达代码，于是评测也就没人想起来覆盖它。
      2026-08-18 发现 0 行的原因不是「需联网」——POEDB 镜像页一直在 http_cache 里、
      抽取器对它跑得通（134 条），只是这条采集从来没跑过。补上用例，
      免得下次某个能力又在「代码写了、数据没进、评测不覆盖」三不管里躺着。

      措辞里**必须出现「元词缀矩阵」**：`_metamod_source_policy` 只在问题显式提到来源时
      才返回 positive，否则不路由（`tests/unit/test_metamods.py` 的
      `test_不含矩阵限定同义词改参和多余参数均拒绝` 把这条钉死了）。这是刻意的——矩阵是
      社区页（P4）的转述、没有可验证的版本范围，它的单元格不能被当成通用游戏规则读。
      代价是用户不提来源就拿不到答案；要改这个契约得是一次**明确的产品决定**加新证据，
      不是把判据悄悄放宽。第一版用例写成「神圣石在「前缀无法被变更」下的结果是什么」，
      录制出来是 0 token 的缺据——被路由挡住了，正好把这条契约量了出来。

  - id: gap_metamod_blank_cell
    query: 元词缀矩阵里异能混沌石对无法骰出攻击词缀是什么结果
    kind: gap
    expect_gap: true
    note: 来源页面该格为空白 → 必须拒答，不能推断为 N/A
    lesson: >-
      空白格是这套矩阵最危险的地方：页面留空**不等于** N/A，也不等于 unknown。
      入库时空白格只进抽取审计、不成为 Citation（实测该页有 2 个空白格，
      都在异能混沌石那一行），编排层再由 _metamod_source_blank_answer 生成确定性拒答。
      这条用例钉的是「代码路径」而不是「模型自觉」。

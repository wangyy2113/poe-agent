      现在它该答（20 级 1659–2488），而不是拒答
    lesson: >-
      与上一条成对：两条路（意图词、别名命中）都要能通到**答案**，
      而不是都能通到拒答。别名通道那条判据本身没变，变的是那一维有没有数据。


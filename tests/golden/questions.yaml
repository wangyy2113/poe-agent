  # ── 化石的标签权重乘数（2026-09-08 第六十五轮入库）──────────────
  - id: num_fossil_tag_weight
    query: 炽炎化石对火焰和冰霜的权重乘数分别是多少
    kind: numeric
    expect_values: ["0", "10"]

# 黄金问答集（任务 2.7 / 需求 3.7、3.9、16.7）
#
# 这是评测的**唯一真源**：`scripts/eval_run.py` 与 `scripts/test_search.py` 都读它，
# 不再各自内嵌一份用例，否则两份迟早分叉、哪个对都说不清。
#
# 字段
#   id                    稳定标识。录制文件与人工审计结论都按它索引，**不要改已有 id**
#   query                 用户问题原文
#   kind                  name | description | numeric | cross_source | gap | tool_route
#   expect_slug           期望命中的实体。两种写法：
#                           `slug`        只比 entity_id 末段（唯一装备等 id 稳定的类型）
#                           `类型:slug*`  比完整 entity_id 前缀，并顺带断言实体类型
#                                         （天赋类实体 id 末尾带内容哈希，写死会假失败）
#   expect_any_hit        只要求有命中，不指定命中谁
#   expect_gap            必须判为依据不足，走缺据声明
#   expect_evidence_text  证据原文里必须出现的串。**离线可校验**，考的是召回质量
#   expect_values         答案里应出现且必须可溯源的数值。需要生成结果，重放/在线时校验
#   expect_in_answer      答案里必须出现的表述。用于「该说的话有没有说」这类断言
#   forbid_in_answer      答案里不得出现的表述。用于负向断言
#   expect_tool           期望模型选用的工具（tool_route 类专用，需要在线或录制）
#   note                  一句话说明这条考什么
#   lesson                这条用例的来历。**不要删**——它记录的是曾经踩过的坑
#
# 期望值来源：数值类与 cross_source 类的期望全部从 data/poe.db 逐条核对后写死
# （2026-08-17，mod_affix 93897 行 / entity 3812 行）。数据更新后若断言失败，
# 先核对上游再改这里，不要为了让测试变绿而改期望。


      （唯一匕首）、阿拉卡力之**触**（怪物词缀）与同名升华节点，覆盖率 0.75，
      域闸门又因为 hints 里只有「万神殿」而不触发，于是无据进了模型。
      按项目自己的判据「该拦的地方是入口」——正确修法是把这一维补上，

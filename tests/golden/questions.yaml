    expect_in_answer: ["未确认"]
    forbid_in_answer: ["不能辅助"]
    note: >-
      **成对哨兵**：冰霜新星是新星不是投射物，两侧清单里没有这一对。
      但库里查不到**不等于**「不能」——也可能是两侧清单不同步而未确认。
      工具因此只说「本库未确认」，`forbid_in_answer` 钉住它不许说成「不能辅助」
    lesson: >-
      这一维只入两侧一致的交集（另有 2,201 对只有一侧说），
      所以「查不到」有两种含义，而工具**不区分**这两种情况就只能说未确认。
      与唯一装备详情页「两侧对不上就拒绝合并」是同一条规矩。


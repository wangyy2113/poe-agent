  - id: gap_skill_gem_numbers
    query: 冰霜脉冲在 20 级时的基础伤害是多少
    kind: gap
    expect_gap: true
    note: >-
      2026-08-19 起 skill_gem = partial：宝石本身入库了（冰霜脉冲是库里的实体），
      但**伤害数值仍未采集**——PoB 存的是乘数，要按它的公式算才是显示值
    lesson: >-
      这条哨兵考的东西**换了一层**：入库前它验的是「领域未采集就别答」，
      入库后验的是第二道闸门——实体在库里不等于被问的那一面有数据。
      两条路都必须走得通，所以用例不动、note 改掉。

  - id: gap_skill_gem_damage_no_level_wording
    query: 冰霜脉冲的伤害是多少
    kind: gap
    expect_gap: true
    note: >-
      同一个边界，但句子里**没有任何宝石意图词**——领域靠别名精确命中识别
      （810 颗宝石名不可能进词表）
    lesson: >-
      加这条是因为 `gap_skill_gem_numbers` 只覆盖了带「20 级」的问法。
      去掉等级说法后，靠 hints 的那条路就断了；补上「别名命中的实体类型也算问到该领域」
      之后才拦得住。只收别名通道、不收 BM25：检索前几条里夹一张宝石卡是常事，
      拿它当领域信号会让含「伤害」的装备问题被误拦。

  - id: gap_skill_gem_attribute_req
    query: 冰霜脉冲需要多少智力需求
    kind: gap
    expect_gap: true
    note: >-
      属性需求（力/敏/智）明确不入库：Gems.lua 的 reqInt 是换算系数不是显示值，
      PoB 要按 round((20+(等级需求-3)×3)×(系数/100)^0.9×statType) 才得到显示需求

  - id: gap_boss_mechanics

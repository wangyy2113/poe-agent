      **裸的「化石」不能进意图词**：化石的词缀池早就入库成 1983 条
      `category='delve'`。分界是**问的是哪一侧**——给定标签反查哪个化石偏向它，
      只需 `tag_weight_lookup`；给定精确化石与底材问地渊目录，则由
      `fossil_operation_state` 同时披露标签规则与目录边界。


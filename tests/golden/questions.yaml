    note: >-
      120 − 60 = 60，落在上限以下 → 实际生效 60%。这条与上一条成对：
      超抗顶得住减抗（减抗进的是加总那一步），顶不住穿透（穿透在夹上限之后）

  - id: num_max_phys_reduction
    query: 物理伤害减免的上限是多少
    kind: numeric
    expect_values: ["90"]
    note: 游戏常量 maximum_physical_damage_reduction_% = 90

  # ── 受击结算（2026-08-19 第二十一轮）───────────────────────────
  - id: num_armour_reduction
    query: 10000 护甲面对一次 1000 的物理打击能减多少伤害
    kind: numeric
    expect_values: ["67"]
    expect_in_answer: ["头目"]
    note: >-
      10000 /（10000 + 5 × 1000）= 66.67% → 取整 67%。伤害数值由问题给出，
      工具不替用户假定
    lesson: >-
      `expect_in_answer` 只断言**代码附注**的内容（边界声明里写着不含头目的护甲倍率），
      不断言模型措辞。

  - id: gap_armour_without_damage
    query: 我有 10000 护甲，能减多少伤害
    kind: gap
    expect_gap: true
    note: >-
      **这条问题没有答案**：护甲减伤 = 护甲 /（护甲 + 5 × 这一击的伤害），
      不给伤害数值就没有百分比。工具必须说缺什么，而不是替用户假定一个伤害值
    lesson: >-
      与 `num_armour_reduction` 成对：同样的护甲值，给了伤害就必须算得出来，
      没给就必须说缺据。只压一头会退化成「问什么都先要一堆参数」
      或者「随便假定一个 1000 伤害算给你看」。
      注意它走的是**工具自报缺据**那条路（`mitigation_calc` 返回 rules + 缺什么），
      检索侧因此是路由豁免，对错看 `--gate` 的录制回放。

  - id: num_evade_chance_at_85
    query: 我有 10000 闪避，85 级怪物打我能躲开多少
    kind: numeric
    expect_values: ["53", "559"]
    note: >-
      monsterAccuracyTable 第 85 项 = 559 命中值；
      命中率 = 取整(559 /(559 +(10000 / 5) ^ 0.9) × 125) = 47% → 闪避率 53%
    lesson: >-
      怪物命中值来自库里的等级表，所以「85 级」这个前提是**查出来的**而不是假定的，
      而且用了哪一级要写在推导里。

  - id: num_spell_suppression_effect
    query: 法术压制触发时减多少伤害
    kind: numeric
    expect_values: ["40"]
    note: pobMisc.SuppressionEffect = 40，不是社区常说的 50%
    lesson: >-
      这条是「常量摆在库里答不了问题」的反例之一：40 这个数只有和「触发时减伤」
      这个口径绑在一起才有意义。

  # ── 回复（2026-08-20 第二十三轮）─────────────────────────────
  - id: num_es_recharge_full
    query: 我有 5000 能量护盾，受伤之后多久能回满
    kind: numeric
    expect_values: ["1650", "2"]
    note: >-
      每秒回充 5000 × 0.33 = 1650，延迟 2 秒，回满约 3 秒 → 受伤后约 5 秒。
      **两段都要说**：只讲每秒 33% 会让人以为受伤后立刻开始回
    lesson: >-
      回满耗时与护盾大小无关（每秒回的是百分比），但**每秒回多少**必须有池大小才算。
      证据里另附一条口径提示：PoB 取的是字面量 0.33，而 GGG 常量换算是 33.33%/秒，
      两者差正好 1%——按 PoB 算得 1650 而不是 1666.7。

  - id: num_leech_caps
    query: 生命偷取的速率上限和单次上限分别是多少
    kind: numeric
    expect_values: ["20", "10"]
    note: >-
      两层上限：每秒最多回复最大生命的 20%（速率），单次偷取实例最多回复 10%（量）。
      前者限速、后者限量，混成一个数就是错的
    lesson: >-
      三种池的值不同（护盾的速率上限只有 10%），所以工具按池分别取常量，
      不合并成一个数。

  - id: gap_leech_without_pool
    query: 我 2% 生命偷取，一击打 3000 伤害，每秒能回多少
    kind: gap
    expect_gap: true
    note: >-
      **缺池大小**：偷取的速率与两层上限都是按最大生命的百分比算的，
      不给最大生命就没有每秒回复量。工具说缺什么，而不是替用户假定一个 4000
    lesson: >-
      与 `num_leech_caps`、护甲那一对同一条纪律：给了池就必须算得出来，
      没给就必须说缺什么。

  # ── 保留（2026-08-20 第二十四轮）─────────────────────────────
  - id: num_aura_reservation
    query: 我 4000 魔力，开坚定和优雅之后还剩多少
    kind: numeric
    expect_values: ["50", "4000"]
    note: >-
      两个光环 20 级各保留 50% 最大魔力 → 合计 100% → 4000 全部保留、剩 0。
      保留百分比是**查库**来的（`pob_skill_level`），不是让用户报数
    lesson: >-
      「20 级」这个前提要写进推导：它是查出来的，不是替用户假定的
      （与 `passive_path` 的「路径要逐节点列出」同一条纪律）。

  - id: num_clarity_flat_reservation
    query: 清晰 20 级保留多少魔力
    kind: numeric
    expect_slug: Clarity
    expect_values: ["279"]
    note: >-
      **定值保留 279 点**。这一列（`reservation_flat`）是第二十四轮才补的——
      先前库里只有百分比那一列，于是清晰 / 精准 / 活力看起来「不保留任何魔力」
    lesson: >-
      这条是「已入库 ≠ 被问的那一维已入库」的又一例：宝石早就入库了，
      缺的是它保留资源的**那一种写法**。实测 PoB 侧有 400 条 manaReservationFlat。

  # ── 持续伤害（2026-08-20 第二十五轮）───────────────────────────
  - id: num_ignite_per_second
    query: 一击造成 10000 火焰伤害的点燃，每秒打多少、总共打多少
    kind: numeric
    expect_values: ["9000", "4", "36000"]
    note: >-
      点燃是**每秒** 90% 火焰伤害、持续 4 秒 → 每秒 9000、总共 36000。
      「每秒」这个口径的出处是 PoB 自己的说明字符串（`ignite deals 90% per second`）
    lesson: >-
      把「每秒 90%」记成「总共 90%」，结论差 4 倍。所以证据里每秒、持续、总共三段都写。

  - id: desc_bleed_not_mitigated_by_armour
    query: 流血伤害会被护甲减免吗
    kind: description
    expect_any_hit: true
    expect_in_answer: ["感电"]
    note: >-
      **不会**：物理持续伤害只被目标的物理伤害减免削（上限 75%），护甲只作用于击中。
      判据是 PoB 流血那段 effMult 只取 `PhysicalDamageReduction`、完全没有 Armour
    lesson: >-
      `expect_in_answer` 只断言**代码附注**的边界声明（里面写着不含感电与冰冻），
      不断言模型措辞。

  - id: num_poison_stacks
    query: 中毒能叠几层
    kind: numeric
    expect_values: ["30", "2"]
    note: >-
      中毒**没有层数上限**（点燃与流血默认 1 层），每秒 30%、持续 2 秒；
      真实 DPS 取决于攻速
    lesson: >-
      三种异常的叠加规则不同，合并成一句「异常默认 1 层」就会把中毒答错。

  # ── Max Hit（2026-08-20 第二十七轮）────────────────────────────
  - id: num_max_hit_resist_only
    query: 我 5000 血、火抗 75%，一发火焰伤害最多能挨多少
    kind: numeric
    expect_values: ["20000"]
    note: >-
      没有护甲时是一步除法：5000 ÷ 0.25 = 20,000（抗性把一发砍到四分之一）
    lesson: >-
      Max Hit 是抗性 / 护甲 / 减伤 / 池子这条链的**反解**，它是前六块计算器的合流。
      分开问四遍要用户自己乘一遍，那正是最容易算错的地方。

  - id: num_max_hit_with_armour
    query: 我 5000 血、10000 护甲，一发物理伤害最多能挨多少
    kind: numeric
    expect_values: ["6531"]
    expect_in_answer: ["Mind over Matter"]
    note: >-
      有护甲时要解二次方程（护甲减伤依赖伤害大小），答案 6,531——
      既不是 5,000 也不是 10,000。这一发会被挡掉约 23%
    lesson: >-
      `expect_in_answer` 只断言**代码附注**的边界声明（里面写着不含 Mind over Matter），
      不断言模型措辞。边界本身是这一轮最重要的产出：
      PoB 自己的注释说完整解「可能要解六次多项式」，所以只做单类型那一支。

  # ── 门槛型异常（2026-08-20 第二十六轮）─────────────────────────
  - id: num_shock_on_boss
    query: 一击打 100000 闪电伤害，对 83 级头目能感电多少
    kind: numeric
    expect_values: ["7.68", "19"]
    note: >-
      83 级头目的异常门槛 = 15319 × 7.68 ×（19.64 × 0.47）≈ 1,086,003，
      比值 0.0921 → 50 × 0.0921^0.4 ≈ 19%。**头目那个 7.68 是上游硬编码的字面量**
    lesson: >-
      同一击打 83 级小怪是满感电 50%、打头目只有 19%——门槛差 34 倍。
      所以「能感电多少」必须先问「打谁」，不能替用户假定等级。

  - id: num_shock_cap_ruler
    query: 感电最多能有多少，要打到上限需要什么条件
    kind: numeric
    expect_values: ["50"]
    note: >-
      上限 50%（`nonDamagingAilment.Shock.max`）。一条能记住的标尺：
      比值为 1（这一击等于目标的异常门槛）时正好 50%
    lesson: >-
      五种门槛型异常的基数与上下限都不同（脆弱基数 10、上限 6%），
      拿感电那套去答脆弱就是错数字。

  - id: desc_freeze_partial_answer
    query: 一击 100000 冰霜伤害能把 83 级头目冻住几秒
    kind: description
    expect_any_hit: true
    expect_values: ["0.3", "7.68", "1086002"]
    expect_in_answer: ["时长曲线"]
    note: >-
      **能答一半**：时长曲线没有可引用的上游原式（PoB 那段只算了 `FreezeDurationMod`），
      但门槛判据是钉住的——要冻住最短 0.3 秒，目标门槛不能超过这一击伤害的 20 倍
      （200 万），而 83 级头目门槛 108.6 万，所以能冻住至少 0.3 秒、**几秒仍算不出来**。
      断言取「0.3」（最短时长）、「7.68」（头目倍率）与门槛本身——
      数值契约现在忽略千分位（第二十七轮修的测量缺陷），所以
      模型写「1,086,002.88」也算命中；而那 200 万它往往只写成「伤害的 20 倍」，
      断言它会变成对措辞的断言，所以不断言
    lesson: >-
      这条第一次录制时是 `kind: gap`，而它「通过」的方式是
      **模型连着调工具三次、把 token 预算烧光**——契约（该拒答）过了、机制是坏的。
      根因是工具对冰冻直接报错，把「能答的那一半」也一起扣住了。
      改成结构化的半个答案之后，用户拿到了门槛判据，而「几秒」照旧不编。

  - id: route_reservation_calc
    query: 坚定和优雅一共保留多少魔力
    kind: tool_route
    expect_tool: reservation_calc
    note: 「保留多少」+ 库里认得的技能名 → reservation_calc
    lesson: >-
      **不能**把「还剩多少」当意图词：实测它会把
      「地图 −60% 元素抗性之后我还剩多少火抗」从抗性计算器抢走（成对用例当场拦下）。
      带技能名的保留问法由数字通道兜，且要求问题里有「保留 / 光环 / 还剩 / 开得起」
      这类信号——光环名 + 魔力还不够，否则「20 级憎恨的魔力消耗」会被抢走。

  - id: route_recovery_calc
    query: 魔力再生怎么算
    kind: tool_route
    expect_tool: recovery_calc
    note: 基数是每分钟 105%（每秒 1.75%）——拿 105 当每秒用会差 60 倍
    lesson: >-
      裸的「偷取」「回充」「再生」是属性名，所以
      「生命偷取能从哪些渠道获得」仍归 stat_sources（`_YIELDS_TO_ENUMERATION` 让路）。

  - id: route_mitigation_calc
    query: 格挡上限是多少
    kind: tool_route
    expect_tool: mitigation_calc
    note: 「格挡上限」是结算问法 → mitigation_calc
    lesson: >-
      判据必须专指**结算**而不是**属性名**：先写了裸的「法术压制」，
      于是「法术压制能从哪些渠道获得」被从 stat_sources 抢走（现有单测当场拦下）。
      现在两个计算器遇到枚举意图词一律让路——枚举问句永远不是计算题。

  # ══ 跨来源：本轮只能测负向 ═════════════════════════════════════════════
  # 库里 kind='mod' 的**已确认冲突是 0 条**，只有 mod_review 2729 条
  # （两源对不上、待人工核对）。按需求 15.5 与 /admin/conflicts 的约定，
  # mod_review 不得当作冲突呈现，所以这一类只能验证「不要谎报冲突」。
  # 等人工核对把某条改成 kind='mod' 之后，再补正向用例（并列展示 + 推荐 POEDB）。

  - id: cross_lifeleech_amulet
    query: 护身符上的生命偷取词缀有几档
    kind: cross_source
    expect_any_hit: true
    forbid_in_answer: ["存在冲突", "两个来源冲突", "数据冲突"]
    note: POEDB T3/3 与 PoB LifeLeech1 区间对不上，但那是 mod_review，不得说成冲突

  - id: cross_no_confirmed_conflict
    query: 知识库里有哪些已确认的跨来源数据冲突
    kind: cross_source
    expect_gap: true
    forbid_in_answer: ["待核对", "mod_review"]
    note: >-
      已确认冲突为 0 条，且 source_conflict 表不进 chunk 索引（只由 /admin/conflicts
      暴露），所以普通问答确实无依据 → 应走缺据声明，且不得把待核对项列为冲突

  - id: cross_pob_priority
    query: 词缀数值以 POEDB 还是 Path of Building 为准
    kind: cross_source
    expect_in_answer: ["POEDB"]
    note: 来源优先级 P1 > P2，冲突时推荐 POEDB
    lesson: >-
      这条曾写成 expect_any_hit，跑出来是「错误拒答」——但期望本身错了：
      知识库里没有任何描述来源优先级的文档 chunk，这个策略写在 config.yaml
      的 sources.priority 与系统提示词里，本就不该由文档检索来回答。
      改为答案级断言（需要生成结果），检索侧不对它判定。

  # ══ 知识库确定不覆盖：必须拒答 ═════════════════════════════════════════
  # V1 验收里最关键的一类。判据是 sufficient=false 且不伪造引用。

  - id: gap_xuanxu_boots
    query: 玄虚之靴有什么属性
    kind: gap
    expect_gap: true
    note: POEDB 无此名称·必须拒答（真名为神行靴）

  - id: gap_poe2_ascendancy
    query: 流放之路2 的升华机制是什么
    kind: gap
    expect_gap: true
    note: 越界·POE2
    lesson: >-
      靠「升华」+「机制」能拿到 67% 覆盖率过线，未覆盖的「流放之路2」恰是
      「问的是另一款游戏」的标志。因此覆盖率达标后还要检查未覆盖词是否全库为零。

  # ── POE1/POE2 边界：**靠覆盖率拦不住，必须靠专指标记** ───────────────────
  # 2026-08-18 实测「poe2 词缀怎么洗」被判**依据充分**（覆盖率 100%）：分词把数字
  # 标记吃掉了（`poe2` → `['poe','词缀']`、`流放之路2` → `['流放','升华','机制']`），
  # 问题退化成一个纯 POE1 问题，于是拿到了 POE1 的词缀数据。
  # 现在由 `orchestrator/loop.poe2_marker()` 在**原始问题串**上匹配标记，
  # 命中即由代码生成越界声明，不检索、不调模型。

  - id: gap_poe2_latin_marker
    query: poe2 词缀怎么洗
    kind: gap
    expect_gap: true
    expect_in_answer: ["流放之路 1"]
    note: >-
      曾经的真实漏出：分词把 poe2 的「2」吃掉后覆盖率 100%，被判依据充分。
      这条钉住「拉丁写法的标记也必须拦」

  - id: gap_poe2_chinese_alias
    query: 流放之路：降临的通货有哪些
    kind: gap
    expect_gap: true
    note: POE2 的中文正式名。**单独的「降临」不能当标记**——POE1 有天赋「先祖降临」「惊寒降临」

  - id: gap_poe2_second_edition
    query: 第二部的暴击机制怎么算
    kind: gap
    expect_gap: true
    note: 越界·POE2 的口语说法

  - id: name_ancestral_reach_not_poe2
    query: 先祖降临这个天赋给什么
    kind: name
    expect_slug: "passive:Ancestral_Reach_*"
    note: >-
      反例：POE1 的天赋节点名里含「降临」。若把单独的「降临」当作 POE2 标记，
      这条正常问题会被拒答——与 boss 领域曾把「怪物」当意图词是同一种错

  - id: gap_syndicate_network
    query: 辛迪加情报网怎么运作
    kind: gap
    expect_gap: true
    note: 隐匿词缀已入库，但情报网成员/部门/解锁流程未采集

  - id: gap_weather
    query: 今天上海天气怎么样
    kind: gap
    expect_gap: true
    note: 越界·非 POE 问题

  - id: gap_fake_keystone
    query: 霜锻穹顶这个基石给什么属性
    kind: gap
    expect_gap: true
    note: 天赋树已采集，但没有这个名字·必须拒答
    lesson: >-
      选名要避开与既有实体名的**子串**重叠。原先用「虚空壁垒」，被唯一装备
      「虚空」(Null and Void) 子串命中别名表 → exact_hit 直接判充分依据，
      覆盖率 25% 也照样漏出。别名子串匹配这个边界是已知未修项：它存在是为了让
      带上下文的专名查询能命中（需求 3.5），收紧要同时保住那条，留作单独课题。

  - id: gap_next_league_guess
    query: 请你猜一下下个赛季会加什么新机制
    kind: gap
    expect_gap: true
    forbid_in_answer: ["可能会", "预计", "大概"]
    note: 用户明确索要猜测·必须说明本助手不提供猜测

  - id: gap_price_headhunter
    query: 猎首现在值多少混沌石
    kind: gap
    expect_gap: true
    forbid_in_answer: ["大约", "左右", "参考价"]
    note: 经济源未接入（economy_price = not_collected），不得按同类物品类推价格

  - id: gap_cluster_jewel_notables
    query: 大型星团珠宝能开出哪些大点
    kind: gap
    expect_gap: true
    note: cluster_jewel = not_collected
    lesson: >-
      易误判：ModJewelCluster.lua 已入库，但那是星团珠宝**自身的词缀**，
      不是它能开出的天赋点定义。

  - id: gap_prefix_capacity
    query: 稀有装备最多能有几条前缀
    kind: gap
    expect_gap: true
    note: craft_rule 未结构化，game_constant 里查无此键·不得硬编码 3/3

  - id: gap_skill_gem_numbers
    query: 冰霜脉冲在 20 级时的基础伤害是多少
    kind: gap
    expect_gap: true
    note: >-
      2026-08-19 起 skill_gem = partial：宝石本身入库了（冰霜脉冲是库里的实体），
      但**伤害数值仍未采集**——PoB 存的是乘数，要按它的公式算才是显示值
    lesson: >-
      这条哨兵考的东西**换了一层**：入库前它验的是「领域未采集就别答」，
      入库后验的是第二道闸门——实体在库里不等于被问的那一面有数据。
      两条路都必须走得通，所以用例不动、note 改掉。

  - id: gap_skill_gem_damage_no_level_wording
    query: 冰霜脉冲的伤害是多少
    kind: gap
    expect_gap: true
    note: >-
      同一个边界，但句子里**没有任何宝石意图词**——领域靠别名精确命中识别
      （810 颗宝石名不可能进词表）
    lesson: >-
      加这条是因为 `gap_skill_gem_numbers` 只覆盖了带「20 级」的问法。
      去掉等级说法后，靠 hints 的那条路就断了；补上「别名命中的实体类型也算问到该领域」
      之后才拦得住。只收别名通道、不收 BM25：检索前几条里夹一张宝石卡是常事，
      拿它当领域信号会让含「伤害」的装备问题被误拦。

  - id: gap_skill_gem_attribute_req
    query: 冰霜脉冲需要多少智力需求
    kind: gap
    expect_gap: true
    note: >-
      属性需求（力/敏/智）明确不入库：Gems.lua 的 reqInt 是换算系数不是显示值，
      PoB 要按 round((20+(等级需求-3)×3)×(系数/100)^0.9×statType) 才得到显示需求

  - id: gap_boss_mechanics
    query: 潜伏之主的技能怎么应对
    kind: gap
    expect_gap: true
    note: >-
      2026-08-19 起该域改名为「Boss 技能与应对」并仍是未采集：缓存的 Monsters 页里
      **没有** Boss 技能与打法，只有怪物词缀、幽魂倍率与按等级的基础数值表
    lesson: >-
      拆域不能把这条变成能答。原先一个域叫「Boss 与怪物」，把三件事混在一起，
      于是「已抓取未入库」读起来像是差一个抽取器——实际缺的是**来源**。

  - id: rank_spectre_life
    query: 生命倍率最高的幽魂是哪个
    kind: description
    expect_any_hit: true
    note: >-
      2026-08-19 第十四轮起**可答**：PoB `Data/Spectres.lua` 的 268 条建模数据入库后，
      排名在这份「确认可用」清单里做，答案要写明这个范围
    lesson: >-
      这条用例**从拒答翻成可答**，是上一轮那条边界被解掉的凭证。上一轮它拦的是
      「有出处但对玩家是错」的答案（拿开发用怪物「测试之灵」10000% 去排名）；
      解法不是放宽判据，而是补上一份能区分「实际可用」的数据。

  - id: gap_spectre_drops
    query: 幽魂会掉落什么东西
    kind: gap
    expect_gap: true
    note: 掉落未采集。两个来源都没有这一维

  - id: gap_spectre_skills
    query: 幽魂会放什么技能
    kind: gap
    expect_gap: true
    note: >-
      怪物技能在 PoB 侧只有内部 id（`MonsterLightningThorns`），实测 1235 个 id 与本库
      810 颗宝石的 grantedEffectId **零命中**——它们不是玩家宝石，没有中文名可给
    lesson: >-
      有数据不等于可呈现。这一维的 id 存进了 `pob_spectre.skill_ids`（将来接怪物技能表
      时它就是桥接键），但不进卡片也不进工具正文。

  - id: gap_monster_mod_weight
    query: 惊悸迷雾怪物词缀的生成权重是多少
    kind: gap
    expect_gap: true
    note: 怪物词缀入库了效果文本，但生成权重与出现规则未采集

  - id: num_passive_path_cost
    query: 从起点点到神威之盾要花几个天赋点
    kind: numeric
    expect_values: ["11"]
    note: >-
      2026-08-19 第十五轮起**可答**：连接关系与职业起点入库后，`passive_path` 按职业
      分别算。最省是圣堂武僧与野蛮人各 11 点（树 3.29）
    lesson: >-
      这条用例**从拒答翻成可答**，而且答案必须**按职业分别给**——同一个基石从暗影
      起点要 24 点、从游侠 25 点。给一个笼统的数字就是错答案。
      路径逐节点列出来当证据，用户可以照着核对：这是「算」与「猜」的区别。

  - id: desc_cluster_jewel_not_on_tree
    query: 星团珠宝上的天赋要花几个天赋点
    kind: description
    expect_any_hit: true
    expect_in_answer: ["哪些核心天赋出现在哪种小天赋类型上未采集"]
    note: >-
      2026-08-19 第十八轮起**可答**：星团珠宝清单入库后能给出三个尺寸的结构，
      并说明这些天赋不在主天赋树上、没有「从起点走过去」的点数
    lesson: >-
      断言的是**代码逐字附上的边界声明**（`_NOTE_FIELDS`），不是模型的措辞。
      第一版写的是 `expect_in_answer: ["主天赋树"]`——那句话在证据里，但模型可以选择
      不复述（实测它换成了「证据中没有明确说明每个节点消耗几点」，同样诚实）。
      **考模型措辞的断言天生不稳**，只有代码保证的内容才能当契约。

  - id: num_large_cluster_nodes
    query: 大型星团珠宝能加几个小天赋
    kind: numeric
    expect_values: ["8", "12"]
    note: PoB ClusterJewels.lua 的 minNodes/maxNodes：大型 8–12

  - id: gap_cluster_notable_pool
    query: 大星团珠宝的斧剑伤害能开出哪些核心天赋
    kind: gap
    expect_gap: true
    note: >-
      「哪些核心天赋出现在哪种小天赋类型上」这个映射本地拿不到：
      ClusterJewels.lua 只给「尺寸 → 类型」与一份扁平的 308 条清单，
      树 JSON 的节点字段里也没有 affliction 标签
    lesson: >-
      有 308 条清单在手上，最容易犯的错是拿其中一部分去凑一个「看起来对」的答案。
      这条哨兵钉住：清单在库里 ≠ 那个映射在库里。

  - id: route_passive_path
    query: 从起点点到坚毅之心要花几个天赋点
    kind: tool_route
    expect_tool: passive_path
    note: 点数要在图上算，kb_search 只能命中节点卡片（卡片里没有连接关系）

  # ══ 工具路由：能精确算的不要猜（需要在线或录制）══════════════════════════
  # ALLOWED_TOOLS 的顺序即推荐优先级，这一类验证模型是否按该优先级选工具。
  # 本类不设门槛，作为附加观测记录——路由错不一定导致答案错，但会让本可精确
  # 回答的问题退化成 BM25 命中一张卡再读表格。

  - id: route_mod_tiers
    query: 腰带上的力量词缀一共有几档，每档要求什么物品等级
    kind: tool_route
    expect_tool: mod_tiers
    note: 词缀档位/物品等级/权重 → mod_tiers，不该用 kb_search

  - id: route_stat_sources
    query: 法术压制能从哪些渠道获得
    kind: tool_route
    expect_tool: stat_sources
    note: 枚举类「某属性能从哪来」→ stat_sources（逐渠道 + 未采集声明）

  - id: route_entity_lookup
    query: 冈姆的壮志的完整词缀列表
    kind: tool_route
    expect_tool: entity_lookup
    note: 已知确切名称的实体 → entity_lookup

  - id: route_kb_coverage
    query: 你的知识库covered哪些领域
    kind: tool_route
    expect_tool: kb_coverage
    note: 不确定本库有没有某领域 → kb_coverage

  - id: route_check_mod_combination
    query: 精金胸甲上「+最大生命」和「+火焰抗性」能不能同时存在
    kind: tool_route
    expect_tool: check_mod_combination
    note: 多目标词缀共存 → check_mod_combination（三态，unknown 要原样说明）

  - id: route_bench_recipe
    query: 工艺工作台上有没有加最大生命的选项，费用是多少
    kind: tool_route
    expect_tool: bench_recipe_catalog
    note: 工艺台目录/原始费用 → bench_recipe_catalog，不得改写成制作步骤

  - id: route_spectre_stats
    query: 生命倍率最高的幽魂是哪个
    kind: tool_route
    expect_tool: spectre_stats
    note: >-
      幽魂表**没有卡片**，只能靠「幽魂」意图词路由到工具。这条钉住可达性——
      不路由它就是一个死了的能力

  - id: route_metamod_matrix
    query: 元词缀矩阵里神圣石对前缀无法被变更是什么结果
    kind: tool_route
    expect_tool: metamod_interaction_matrix
    note: 逐字 operation × guard + **显式提到来源** → metamod_interaction_matrix
    lesson: >-
      这个能力此前**完全没有用例**：craft_metamod_interaction 长期 0 行，工具永远返回缺据，
      连闸门里为它写的 scope 规则都是不可达代码，于是评测也就没人想起来覆盖它。
      2026-08-18 发现 0 行的原因不是「需联网」——POEDB 镜像页一直在 http_cache 里、
      抽取器对它跑得通（134 条），只是这条采集从来没跑过。补上用例，
      免得下次某个能力又在「代码写了、数据没进、评测不覆盖」三不管里躺着。

      措辞里**必须出现「元词缀矩阵」**：`_metamod_source_policy` 只在问题显式提到来源时
      才返回 positive，否则不路由（`tests/unit/test_metamods.py` 的
      `test_不含矩阵限定同义词改参和多余参数均拒绝` 把这条钉死了）。这是刻意的——矩阵是
      社区页（P4）的转述、没有可验证的版本范围，它的单元格不能被当成通用游戏规则读。
      代价是用户不提来源就拿不到答案；要改这个契约得是一次**明确的产品决定**加新证据，
      不是把判据悄悄放宽。第一版用例写成「神圣石在「前缀无法被变更」下的结果是什么」，
      录制出来是 0 token 的缺据——被路由挡住了，正好把这条契约量了出来。

  - id: gap_metamod_blank_cell
    query: 元词缀矩阵里异能混沌石对无法骰出攻击词缀是什么结果
    kind: gap
    expect_gap: true
    note: 来源页面该格为空白 → 必须拒答，不能推断为 N/A
    lesson: >-
      空白格是这套矩阵最危险的地方：页面留空**不等于** N/A，也不等于 unknown。
      入库时空白格只进抽取审计、不成为 Citation（实测该页有 2 个空白格，
      都在异能混沌石那一行），编排层再由 _metamod_source_blank_answer 生成确定性拒答。
      这条用例钉的是「代码路径」而不是「模型自觉」。

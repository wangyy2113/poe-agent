    lesson: >-
      它记录的是一条**边界往前挪**：第十二轮到第二十八轮这句必须拒答，
      理由是「PoB 存的是乘数，算错就是带着引用的错数字」——缺的不是数据，是**对账口径**。
      口径补上之后，同一句话必须答得出来；留着不放就变成了「把答得出来的问题声明成缺口」。


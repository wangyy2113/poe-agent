  - id: desc_gem_support_yes
    query: 多重投射能辅助冰霜脉冲吗
    kind: description
    expect_any_hit: true
    expect_evidence_text: "能辅助"
    note: >-
      能。冰霜脉冲是投射物技能，POEDB 两个方向的清单都收录了这一对
      （第四十五轮入库 56,895 对，只收两侧一致的）
    lesson: >-
      判据钉在**证据**上而不是模型措辞上（第一版写的是 `expect_in_answer`）。
      实测模型把结论写成整行加粗 `**能。多重投射(辅) 可以辅助冰霜脉冲。**[[E9]]`，
      而分句在 `。` 上把这一行切成三段、只有末段带标记，于是结论句被闸门拦掉——
      答案实质正确、路由也对，却因为一个排版形态判成缺表述。
      这一维要验的是**工具给没给出裁决**，那就该在证据层断言。
      （那个「整行带标记、行内被切成多句」的形态全集共 59 句，
      够不够格放宽是另一件事，要单独立项先量再改。）


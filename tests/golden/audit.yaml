  sentence: 元素专精（Elemental Mastery）共有 6 个可选效果，**只能选定其中一个**，不是同时获得[[E1]]：
  labels:
  - E1
  evidence_excerpt:
    E1: '# 大师天赋·元素专精（Elemental Mastery）

      大师天赋 ｜ 天赋树 3.29 ｜ 树上 6 处（同名同效，可分别点取）


      以下 6 个效果**只能选定其中一个**，不是同时获得：

      1. 你施加的曝露效果对受影响的抗性至少 -18%

      2. 阻挡受到的 +60% 反射元素伤害

      3. 你受到的曝露效果降低 50%

      4. 击中有 15% 的几率将敌方怪物的元素抗性视作反转

      5. 对你产生的暴击本身不造成元素异常状态

      6. 击中有 3% 的几率额外造成等同于物理伤害 300% 的随机元素伤害



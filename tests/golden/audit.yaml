      | T2/7 | 大法师的 | 法术伤害提高 (37-43)% / +(38-41) 最大魔力 | 58 | 200（0.2517%） |'
  verdict: supported
  note: E1 明写法杖 / 前缀 / Base / 共 7 条 / 互斥规则，逐项对得上
